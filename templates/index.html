<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nifty Options Strategy Backtester</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        .container { max-width: 800px; margin: auto; padding: 2em; border: 1px solid #ccc; border-radius: 10px; }
        h1, h2 { text-align: center; }
        .form-group { margin-bottom: 1em; }
        label { display: block; margin-bottom: 0.5em; }
        input[type="text"], input[type="date"], input[type="number"], select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .form-row { display: flex; gap: 1em; }
        .form-row .form-group { flex: 1; }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nifty Options Strategy Backtester</h1>

        <form action="/login" method="post">
            <h2>Kite API Credentials</h2>
            <div class="form-group">
                <label for="api_key">API Key</label>
                <input type="text" id="api_key" name="api_key" required>
            </div>
            <div class="form-group">
                <label for="api_secret">API Secret</label>
                <input type="text" id="api_secret" name="api_secret" required>
            </div>

            <button type="submit">Login with Kite</button>
        </form>
    </div>
</body>
</html>
